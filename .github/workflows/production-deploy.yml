name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_database:
        description: "Push pending PostgreSQL migrations"
        required: true
        default: true
        type: boolean
      deploy_functions:
        description: "Deploy Supabase Edge Functions"
        required: true
        default: true
        type: boolean
      deploy_frontend:
        description: "Deploy the Vercel production frontend"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
  VITE_APP_ENV: production

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Validate required production configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          required=(VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_APP_URL)

          if [[ "${{ inputs.deploy_database }}" == "true" || "${{ inputs.deploy_functions }}" == "true" ]]; then
            required+=(SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD)
          fi

          if [[ "${{ inputs.deploy_frontend }}" == "true" ]]; then
            required+=(VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID)
          fi

          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required production secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "VITE_SUPABASE_URL must be an HTTPS Supabase project URL" >&2; exit 1 ;;
          esac

          case "$VITE_APP_URL" in
            https://*) ;;
            *) echo "VITE_APP_URL must use HTTPS" >&2; exit 1 ;;
          esac

  deploy_backend:
    needs: validate
    if: ${{ inputs.deploy_database || inputs.deploy_functions }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production Supabase project
        run: |
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Push pending database migrations
        if: ${{ inputs.deploy_database }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Configure Edge Function origin
        if: ${{ inputs.deploy_functions }}
        run: |
          supabase secrets set \
            ACP_APP_ORIGIN="$VITE_APP_URL" \
            --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy report QR function
        if: ${{ inputs.deploy_functions }}
        run: supabase functions deploy report-qr --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy protected user invitation function
        if: ${{ inputs.deploy_functions }}
        run: supabase functions deploy invite-user --project-ref "$SUPABASE_PROJECT_ID"

  deploy_frontend:
    needs:
      - validate
      - deploy_backend
    if: ${{ always() && inputs.deploy_frontend && needs.validate.result == 'success' && (needs.deploy_backend.result == 'success' || needs.deploy_backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run production quality gates
        working-directory: frontend
        run: |
          npm run lint
          npm run test:platform
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build deployable Vercel output
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production release
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
