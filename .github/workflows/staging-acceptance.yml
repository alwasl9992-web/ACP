# Validates Staging authentication, data access, migrations, QR output, and deployed PWA shell.
name: Staging Acceptance Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - "frontend/**"
      - "supabase/**"
      - "scripts/staging-acceptance.mjs"
      - "scripts/staging-work-orders-acceptance.mjs"
      - "scripts/reconcile-staging-admin.mjs"
      - ".github/workflows/staging-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source_quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pinned frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run lint, platform tests, build and production audit
        run: |
          set -euo pipefail
          npm run lint
          npm run test:platform
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Validate acceptance scripts
        working-directory: .
        run: |
          node --check scripts/reconcile-staging-admin.mjs
          node --check scripts/staging-acceptance.mjs
          node --check scripts/staging-work-orders-acceptance.mjs

  database_quality:
    name: Database rebuild, lint and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack
        run: supabase start
      - name: Rebuild database from migrations
        run: supabase db reset
      - name: Lint database schema
        run: supabase db lint --level warning
      - name: Run pgTAP security tests
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup

  staging_acceptance:
    name: Live Staging acceptance
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    needs:
      - source_quality
      - database_quality
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      STAGING_SUPABASE_URL: https://jvxodxfheftylolhqoip.supabase.co
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      STAGING_APP_URL: ${{ github.event_name == 'workflow_dispatch' && 'https://acp-85qn.vercel.app' || '' }}
      STAGING_SUPABASE_PROJECT_REF: jvxodxfheftylolhqoip
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate staging secret configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(SUPABASE_ACCESS_TOKEN STAGING_SUPABASE_URL STAGING_SUPABASE_ANON_KEY STAGING_ADMIN_EMAIL STAGING_ADMIN_PASSWORD)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            required+=(STAGING_APP_URL)
          fi
          missing=()
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required staging configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - name: Link protected Staging database
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$STAGING_SUPABASE_PROJECT_REF"
      - name: Preview pending Staging migrations
        run: supabase db push --dry-run --linked
      - name: Apply pending Staging migrations
        run: supabase db push --linked
      - name: Deploy Staging QR Edge Function
        run: supabase functions deploy report-qr --project-ref "$STAGING_SUPABASE_PROJECT_REF"
      - name: Reconcile Staging System Admin
        run: node scripts/reconcile-staging-admin.mjs
      - name: Run core live Staging acceptance suite
        run: node scripts/staging-acceptance.mjs
      - name: Run live asset work-order acceptance suite
        run: node scripts/staging-work-orders-acceptance.mjs
