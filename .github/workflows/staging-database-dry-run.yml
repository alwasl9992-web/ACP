name: Staging Database Dry Run

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/staging-dry-run.trigger"

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: jvxodxfheftylolhqoip

concurrency:
  group: staging-database-dry-run
  cancel-in-progress: false

jobs:
  dry_run:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Validate staging credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]]; then
            echo "Missing SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
            echo "Invalid staging project reference" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link staging Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show migration status
        run: supabase migration list

      - name: Preview pending migrations
        run: supabase db push --dry-run
