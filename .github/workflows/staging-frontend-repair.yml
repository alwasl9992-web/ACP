name: Generate Canonical Staging Browser Config

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/staging-frontend-repair.yml"
      - "frontend/**"
      - "scripts/staging-acceptance.mjs"

permissions:
  contents: write

concurrency:
  group: staging-browser-config-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://jvxodxfheftylolhqoip.supabase.co
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_APP_URL: https://acp-85qn.vercel.app
    steps:
      - name: Validate browser-safe Staging configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VITE_SUPABASE_ANON_KEY"
          echo "::add-mask::$VITE_SUPABASE_ANON_KEY"
          status=$(curl --silent --show-error --output /tmp/auth-health.json --write-out '%{http_code}' \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/auth/v1/health")
          test "$status" = "200"

      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Generate browser configuration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            supabaseUrl: process.env.VITE_SUPABASE_URL,
            supabaseAnonKey: process.env.VITE_SUPABASE_ANON_KEY,
            appUrl: process.env.VITE_APP_URL,
            environment: 'staging',
          };
          const source = `// Generated by GitHub Actions from the protected staging environment.\n` +
            `// The Supabase publishable/anon key is browser-safe and intentionally public.\n` +
            `export const stagingBrowserConfig = Object.freeze(${JSON.stringify(config, null, 2)} as const);\n`;
          fs.writeFileSync('frontend/src/config/staging.generated.ts', source);
          NODE

      - name: Commit generated public configuration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/config/staging.generated.ts; then
            echo "Browser configuration is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/config/staging.generated.ts
          git commit -m "Generate canonical Staging browser configuration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
