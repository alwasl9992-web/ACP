name: Repair Canonical Staging Frontend

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/workflows/staging-frontend-repair.yml"
      - "frontend/**"
      - "scripts/staging-acceptance.mjs"

permissions:
  contents: read

concurrency:
  group: staging-frontend-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_PROJECT_REF: jvxodxfheftylolhqoip
      VITE_SUPABASE_URL: https://jvxodxfheftylolhqoip.supabase.co
      VITE_APP_URL: https://acp-85qn.vercel.app
      VITE_APP_ENV: staging
    steps:
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for variable in SUPABASE_ACCESS_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!variable:-}" ]]; then missing+=("$variable"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing protected deployment credentials: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve browser-safe Staging API key
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const ref = process.env.STAGING_PROJECT_REF;
          const response = await fetch(`https://api.supabase.com/v1/projects/${ref}/api-keys?reveal=true`, {
            headers: { Authorization: `Bearer ${token}`, Accept: "application/json" },
          });
          if (!response.ok) throw new Error(`Supabase key lookup failed with HTTP ${response.status}`);
          const keys = await response.json();
          const candidates = Array.isArray(keys) ? keys : [];
          const key =
            candidates.find((item) => item?.type === "publishable")?.api_key ||
            candidates.find((item) => item?.name === "anon")?.api_key ||
            candidates.find((item) => item?.type === "anon")?.api_key ||
            "";
          if (!key) throw new Error("No browser-safe Supabase publishable/anon key found");
          console.log(`::add-mask::${key}`);
          const fs = await import("node:fs");
          fs.appendFileSync(process.env.GITHUB_ENV, `VITE_SUPABASE_ANON_KEY=${key}\n`);
          NODE

      - name: Validate Staging API key
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/auth-health.json --write-out '%{http_code}' \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/auth/v1/health")
          test "$status" = "200"

      - name: Install and validate frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run test:platform
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link protected Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy corrected canonical Staging build
        shell: bash
        run: |
          set -euo pipefail
          vercel deploy . \
            --prod \
            --yes \
            --force \
            --build-env VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-env VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            --build-env VITE_APP_URL="$VITE_APP_URL" \
            --build-env VITE_APP_ENV="$VITE_APP_ENV" \
            --token="$VERCEL_TOKEN" | tee /tmp/vercel-deployment-url.txt

      - name: Verify canonical deployment embeds Staging project
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            html=$(curl --silent --show-error --fail "$VITE_APP_URL" || true)
            if [[ "$html" == *'id="root"'* ]]; then
              printf '%s' "$html" > /tmp/acp-index.html
              break
            fi
            sleep 5
          done
          test -s /tmp/acp-index.html
          python <<'PY'
          import re, pathlib, subprocess, os
          html = pathlib.Path('/tmp/acp-index.html').read_text()
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)["\']', html, re.I)
          if not scripts:
              raise SystemExit('No deployed JavaScript bundle found')
          origin = os.environ['VITE_APP_URL'].rstrip('/')
          combined = ''
          for src in scripts:
              target = src if src.startswith('http') else origin + ('/' if not src.startswith('/') else '') + src
              combined += subprocess.check_output(['curl','--silent','--show-error','--fail',target], text=True)
          expected = os.environ['STAGING_PROJECT_REF'] + '.supabase.co'
          if expected not in combined:
              raise SystemExit('Deployed bundle does not contain the expected Staging Supabase project')
          print('Canonical bundle targets the expected Staging Supabase project')
          PY
